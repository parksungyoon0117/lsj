<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>방명록</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff; --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --card: #1f2229; --text: #e6e6e6; --muted: #9aa0aa;
        --line: #30343c; --accent: #60a5fa; --accent-text: #0b1220; --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    form, .msg {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    }
    label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 4px; }
    input, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    .field { margin-bottom: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .count { font-size: 0.8rem; color: var(--muted); }
    button {
      padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
      color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { min-height: 1.5em; margin: 12px 0; font-size: 0.9rem; color: var(--muted); }
    .status.error { color: var(--error); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .msg-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .msg-name { font-weight: 600; }
    .msg-time { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .msg-content { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
  <main>
    <h1>방명록</h1>
    <p class="sub">한 줄 남기고 가세요.</p>

    <form id="form">
      <div class="field">
        <label for="name">이름</label>
        <input id="name" name="name" maxlength="30" required autocomplete="nickname" />
      </div>
      <div class="field">
        <label for="content">메시지</label>
        <textarea id="content" name="content" maxlength="300" required></textarea>
      </div>
      <div class="row">
        <span class="count" id="count">0 / 300</span>
        <button type="submit" id="submit">남기기</button>
      </div>
    </form>

    <p class="status" id="status" role="status"></p>

    <ul id="list"></ul>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    const form = document.getElementById("form");
    const nameInput = document.getElementById("name");
    const contentInput = document.getElementById("content");
    const submitBtn = document.getElementById("submit");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    if (!window.SUPABASE_URL || window.SUPABASE_URL.includes("YOUR-PROJECT-REF")) {
      setStatus("config.js에 Supabase URL과 anon 키를 먼저 넣어주세요.", true);
      submitBtn.disabled = true;
      throw new Error("Supabase 설정이 비어 있습니다.");
    }

    const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const timeFormat = new Intl.DateTimeFormat("ko-KR", { dateStyle: "medium", timeStyle: "short" });

    // innerHTML 대신 textContent를 써서, 누가 <script> 같은 걸 적어도 실행되지 않게 합니다.
    function renderMessages(messages) {
      listEl.replaceChildren();
      if (messages.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "아직 글이 없습니다. 첫 글을 남겨보세요!";
        listEl.append(li);
        return;
      }
      for (const m of messages) {
        const li = document.createElement("li");
        li.className = "msg";
        const head = document.createElement("div");
        head.className = "msg-head";
        const name = document.createElement("span");
        name.className = "msg-name";
        name.textContent = m.name;
        const time = document.createElement("time");
        time.className = "msg-time";
        time.dateTime = m.created_at;
        time.textContent = timeFormat.format(new Date(m.created_at));
        head.append(name, time);
        const content = document.createElement("p");
        content.className = "msg-content";
        content.textContent = m.content;
        li.append(head, content);
        listEl.append(li);
      }
    }

    // 읽기: select 정책("Anyone can read messages") 덕분에 가능
    async function loadMessages() {
      const { data, error } = await db
        .from("messages")
        .select("id, name, content, created_at")
        .order("created_at", { ascending: false })
        .limit(50);
      if (error) {
        setStatus("불러오기 실패: " + error.message, true);
        return;
      }
      renderMessages(data);
    }

    // 쓰기: insert 정책("Anyone can write messages") 덕분에 가능
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const content = contentInput.value.trim();
      if (!name || !content) {
        setStatus("이름과 메시지를 모두 입력해주세요.", true);
        return;
      }
      submitBtn.disabled = true;
      setStatus("저장 중…");
      const { error } = await db.from("messages").insert({ name, content });
      submitBtn.disabled = false;
      if (error) {
        setStatus("저장 실패: " + error.message, true);
        return;
      }
      contentInput.value = "";
      countEl.textContent = "0 / 300";
      setStatus("남겼습니다!");
      loadMessages();
    });

    contentInput.addEventListener("input", () => {
      countEl.textContent = contentInput.value.length + " / 300";
    });

    loadMessages();
  </script>
</body>
</html>
